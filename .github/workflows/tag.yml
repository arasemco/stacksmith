name: tag

on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Create tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for compose in */compose.yaml; do
            [ -f "$compose" ] || continue
            app=${compose%/compose.yaml}
            version=$(sed -n 's|^[[:space:]]*image: .*:\([0-9][0-9.]*\)[[:space:]]*$|\1|p' "$compose" | head -1)
            test -n "$version"
            tag="$app-v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
              continue
            fi
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          done

      - name: Start the image workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: gh workflow run image.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY"
