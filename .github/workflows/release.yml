name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: |
          apps=$(for f in */compose.yaml; do [ -f "$f" ] && echo "${f%/compose.yaml}"; done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  release:
    needs: apps
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: info
        run: |
          compose="${{ matrix.app }}/compose.yaml"
          version=$(sed -n 's|^[[:space:]]*image: .*:\([0-9][0-9.]*\)[[:space:]]*$|\1|p' "$compose" | head -1)
          image=$(sed -n 's|^[[:space:]]*image: *\([^:]*\):.*|\1|p' "$compose" | head -1 | sed 's|.*/||')
          test -n "$version"
          test -n "$image"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.app }}-v${{ steps.info.outputs.version }}
          name: ${{ steps.info.outputs.image }} v${{ steps.info.outputs.version }}
          generate_release_notes: true
