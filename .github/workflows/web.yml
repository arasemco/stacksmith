name: web

on:
  push:
    branches: [web]
    tags: ["web-v*"]
  pull_request:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run build

  tag:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: |
          version=$(sed -n 's|^[[:space:]]*image: .*:\([0-9][0-9.]*\)[[:space:]]*$|\1|p' compose.yaml | head -1)
          test -n "$version"
          created=false
          if ! git rev-parse -q --verify "refs/tags/web-v$version" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "web-v$version" -m "web-v$version"
            git push origin "web-v$version"
            created=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ needs.tag.outputs.version }}
            ghcr.io/${{ github.repository }}/web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  release:
    needs: [tag, image]
    if: |
      always() &&
      needs.image.result == 'success' &&
      (needs.tag.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/web-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/web-v') && github.ref_name || format('web-v{0}', needs.tag.outputs.version) }}
          name: web v${{ needs.tag.outputs.version }}
          generate_release_notes: true
